<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSML Tagger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .highlight-tag {
      background-color: yellow;
      cursor: pointer;
      padding: 0 2px;
    }
    .rsml-output {
      white-space: pre-wrap;
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 5px;
      font-family: monospace;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2>RSML Tagger</h2>

  <!-- Stage 1: Verbatim Transcript Input -->
  <div id="stage1">
    <label for="verbatimInput" class="form-label">Paste Verbatim Segments:</label>
    <textarea id="verbatimInput" class="form-control" rows="6" placeholder="&lt;segment start=...&gt;...&lt;/segment&gt;"></textarea>
    <button class="btn btn-primary mt-2" onclick="saveVerbatim()">Save</button>
  </div>

  <!-- Stage 2: Tagging -->
  <div id="stage2" style="display: none;">
    <div class="my-3">
      <label class="form-label">Tagging Mode: Select text to tag</label>
      <div id="taggableText" class="p-2 border" onmouseup="handleTextSelection(event)"></div>
    </div>

    <div class="my-3">
      <h5>Generated RSML</h5>
      <div class="rsml-output" id="rsmlOutput"></div>
    </div>
  </div>
</div>

<!-- Tag Attribute Modal -->
<div class="modal fade" id="tagModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Tag Attributes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="tagForm">
          <input type="hidden" id="tagName" name="tagName" />
          <div class="mb-2">
            <label class="form-label">Verbatim</label>
            <input type="text" class="form-control" id="verbatimField" name="verbatim" readonly />
          </div>
          <div class="mb-2">
            <label class="form-label">Normalized</label>
            <input type="text" class="form-control" id="normalizedField" name="normalized" />
          </div>
          <div class="mb-2 d-none" id="classFieldGroup">
            <label class="form-label">Class</label>
            <input type="text" class="form-control" id="classField" name="class" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveTag()">Save Tag</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let segments = [];
  let currentSelection = '';
  const modal = new bootstrap.Modal(document.getElementById('tagModal'));

  function saveVerbatim() {
    const input = document.getElementById('verbatimInput').value;
    segments = Array.from(input.matchAll(/<segment [^>]+>(.*?)<\/segment>/gs)).map((match) => match[1]);
    document.getElementById('taggableText').innerHTML = segments.join(' ');
    document.getElementById('stage1').style.display = 'none';
    document.getElementById('stage2').style.display = 'block';
    updateRSML();
  }

  function handleTextSelection() {
    const selection = window.getSelection();
    const text = selection.toString();
    if (!text.trim()) return;
    currentSelection = text;
    const tagOptions = ['accent', 'code-mix', 'split'];
    const choice = prompt(`Select a tag:\n${tagOptions.join(', ')}`);
    if (tagOptions.includes(choice)) openModal(choice);
  }

  function openModal(tagName) {
    document.getElementById('tagName').value = tagName;
    document.getElementById('verbatimField').value = currentSelection;
    document.getElementById('normalizedField').value = '';
    document.getElementById('classFieldGroup').classList.toggle('d-none', tagName !== 'accent');
    modal.show();
  }

  function saveTag() {
    const form = document.forms['tagForm'];
    const tag = form.tagName.value;
    const verbatim = form.verbatim.value;
    const normalized = form.normalized.value;
    const classAttr = form.class?.value || '';

    const span = document.createElement(tag);
    span.className = 'highlight-tag';
    span.textContent = verbatim;
    span.setAttribute('data-tag', tag);
    span.setAttribute('verbatim', verbatim);
    span.setAttribute('normalized', normalized);
    if (tag === 'accent') span.setAttribute('class', classAttr);

    replaceSelectionWithNode(span);
    modal.hide();
    updateRSML();
  }

  function replaceSelectionWithNode(node) {
    const selection = window.getSelection();
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    selection.removeAllRanges();
  }

  function updateRSML() {
    const container = document.getElementById('taggableText');
    const segments = container.innerHTML
      .replace(/<([^>]+) data-tag="(.*?)"(.*?)>(.*?)<\/\1>/g, (match, tag, tagName, attrs, content) => {
        const v = match.match(/verbatim="(.*?)"/);
        const n = match.match(/normalized="(.*?)"/);
        const c = match.match(/class="(.*?)"/);
        return `<${tagName} verbatim="${v?.[1] || ''}" normalized="${n?.[1] || ''}"${c ? ` class="${c[1]}"` : ''}>${content}</${tagName}>`;
      });
    document.getElementById('rsmlOutput').textContent = `<segment>${segments}</segment>`;
  }
</script>
</body>
</html>
