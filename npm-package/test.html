<html lang="en">

  <title>RSML Example</title>

<script type="module">
  import RSMLAnnotator from "./rsml.esm.js";

  document.querySelectorAll(".tag-textarea").forEach((textarea, index) => {

      textarea: textarea,
      output: document.querySelectorAll(".rendered-transcript")[index]
    });
  });
